server {
    listen       80;
    listen  [::]:80;
    server_name  dsh-java.xiaofuge.cn;

    rewrite ^(.*) https://$server_name$1 permanent;

}

server {
    listen       443 ssl;
    server_name  dsh-java.xiaofuge.cn;

    ssl_certificate      /etc/nginx/ssl/_.xiaofuge.cn.pem;
    ssl_certificate_key  /etc/nginx/ssl/_.xiaofuge.cn.key;

    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;

    ssl_ciphers  HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;

    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
        root   /usr/share/nginx/html/dsh-java.xiaofuge.cn;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        root   /usr/share/nginx/html/dsh-java.xiaofuge.cn;
        index  index.html index.htm;
        add_header Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
