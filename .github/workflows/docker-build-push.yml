# ── deepseek-harness-java Docker 镜像构建并推送到 Docker Hub ──
# 触发条件：打 v* 标签、手动触发（Actions 页面 Run workflow）
name: Build and Push Docker Image

on:
  push:
    tags: ['tag-v*']
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: fuzhengwei
  IMAGE_NAME: deepseek-harness-java

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # ── 1. 检出代码 ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. 设置镜像标签 ──
      - name: Set Image Tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            # 打 tag 时：同时推版本号和 latest
            TAG_SUFFIX=":${VERSION},:latest"
          else
            # 手动触发时：latest + commit 短 sha
            TAG_SUFFIX=":latest,:sha-${GITHUB_SHA::7}"
          fi

          DH_TAGS=""
          IFS=',' read -ra PARTS <<< "$TAG_SUFFIX"
          for part in "${PARTS[@]}"; do
            [[ -n "$DH_TAGS" ]] && DH_TAGS+=","
            DH_TAGS+="${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}${part}"
          done

          echo "dh_tags=${DH_TAGS}" >> $GITHUB_OUTPUT
          echo "dh_latest=${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

      # ── 3. 设置 Docker Buildx ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. 登录 Docker Hub ──
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 5. 构建并推送镜像（Maven 构建在 Dockerfile 内完成，无需预装 JDK）──
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.dh_tags }}
          # 多架构构建（可选，需要时取消注释；注意 Maven 构建在 arm64 模拟下较慢）
          # platforms: linux/amd64,linux/arm64
          # GitHub Actions 构建缓存，加速二次构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # ── 6. 输出镜像信息 ──
      - name: Image Info
        run: |
          echo "✅ 镜像构建并推送成功！"
          echo ""
          echo "📦 Docker Hub："
          echo "${{ steps.tags.outputs.dh_tags }}" | tr ',' '\n' | sed 's/^/  - /'
          echo ""
          echo "🐳 拉取命令："
          echo "  docker pull ${{ steps.tags.outputs.dh_latest }}"
          echo ""
          echo "🚀 运行命令："
          echo "  docker run -d -p 8090:8090 ${{ steps.tags.outputs.dh_latest }}"
