spring:
  datasource:
    url: jdbc:h2:file:./data/deepseek-harness-java;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8

harness:
  llm:
    deepseek:
      base-url: http://127.0.0.1:8777/v1
      api-key: ${DEEPSEEK_API_KEY:sk-waliapi-7ae2ec845ed04815b6374a058d025439}
      max-tokens: 8192
      context-window: 128000
      default-model: glm-5.3-flash
