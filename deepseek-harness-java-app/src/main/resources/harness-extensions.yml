harness:
  extensions:
    skills:
      enabled: true
      project-enabled: true
      # 留空时使用 harness.credentials.home（默认 ~/.dsh）。
      home: ""
      # 可选：随部署包一起分发的技能目录。
      bundled-dir: ""
      # 可选：额外的本地技能目录，目录内支持 <name>/SKILL.md 或 <name>.md。
      roots:
        - ./skills
    mcp:
      enabled: true
      servers:
        - name: baidu-ai-search
          transport: sse
          # 使用环境变量注入 API Key，避免把密钥提交到仓库；启动前设置 BAIDU_APPBUILDER_API_KEY。
          url: http://appbuilder.baidu.com/v2/ai_search/mcp/sse?api_key=${BAIDU_APPBUILDER_API_KEY:}
      # 示例：
      # servers:
      #   - name: filesystem
      #     command: npx
      #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
      #     env: {}
      #     cwd: ""
      #   - name: remote-tools
      #     transport: streamable-http
      #     url: http://127.0.0.1:3000/mcp
      #     headers: {}
    plugins:
      install-root: ./plugins
      node-bridge-enabled: true
      preset:
        - plugin-id: dsh-demo-plugin
          display-name: DSH Demo Plugin
          plugin-version: 1.0.0
          runtime-type: DSH_NODE_BRIDGE
          source-path: ./plugins/demo-plugin
          entrypoint: index.js
          auto-start: true
        - plugin-id: sample-tools
          display-name: Sample Tools Plugin
          plugin-version: 1.0.0
          runtime-type: JAVA_NATIVE
          source-path: ./plugins/sample-tools-plugin-1.0.0.jar
          entrypoint: sample-tools-plugin-1.0.0.jar
          auto-start: true
