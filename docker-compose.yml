version: "3.8"
services:
  app:
    build: .
    ports:
      - "8090:8090"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-sk-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SPRING_PROFILES_ACTIVE=standalone
    volumes:
      - ./data:/app/data
      - ./plugins:/app/plugins
      - ./.dsh:/root/.dsh
      - ./workspaces:/app/workspaces
    restart: unless-stopped
